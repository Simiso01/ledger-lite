<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger Lite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Personal finance</p>
      <h1>Ledger Lite</h1>
    </div>
    <label class="month-field">
      Month
      <input id="month" type="month" aria-label="Month">
    </label>
  </header>

  <section class="stats" aria-label="Month summary">
    <article class="stat">
      <p>Income</p>
      <strong id="income">R 0.00</strong>
    </article>
    <article class="stat">
      <p>Expenses</p>
      <strong id="expenses">R 0.00</strong>
    </article>
    <article class="stat">
      <p>Left</p>
      <strong id="left">R 0.00</strong>
    </article>
    <article class="stat">
      <p>Budget used</p>
      <strong id="used">0%</strong>
      <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    </article>
  </section>

  <main class="layout">
    <form id="entry" class="card">
      <h2>Add a transaction</h2>
      <label>
        Type
        <select id="type" name="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </label>
      <label>
        Amount (ZAR)
        <input id="amount" name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
      </label>
      <label>
        Category
        <select id="category" name="category"></select>
      </label>
      <label>
        Date
        <input id="date" name="date" type="date" required>
      </label>
      <label>
        Note
        <input id="note" name="note" type="text" maxlength="80" placeholder="What was this for?">
      </label>
      <button type="submit">Save transaction</button>
      <p id="form-error" class="error" role="alert"></p>
    </form>

    <section class="card">
      <div class="section-head">
        <h2>Budget</h2>
      </div>
      <form id="budget-form" class="inline">
        <label>
          Monthly budget
          <input id="budget" type="number" min="0" step="0.01" placeholder="0.00">
        </label>
        <button type="submit">Set budget</button>
      </form>

      <div class="section-head list-head">
        <h2>Transactions</h2>
        <div class="row-actions">
          <button id="sample" type="button" class="ghost">Load sample</button>
          <button id="clear" type="button" class="ghost">Clear month</button>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">No transactions this month. Add one, or load the sample.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
